name: Build and Release

# Push a tag like v1.0.0.0 to build EmoteMirror and attach latest.zip to a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Match the SDK your project targets (check `dotnet --version` locally).
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Check tag matches csproj version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $xml = [xml](Get-Content emotemirror/EmoteMirror.csproj)
          $v = ($xml.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          if ("v$v" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match csproj Version v$v. Bump the csproj and EmoteMirror.json first."
            exit 1
          }

      - name: Build
        run: dotnet build emotemirror/EmoteMirror.csproj -c Release

      - name: Locate latest.zip
        id: pack
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse -Filter latest.zip -Path emotemirror/bin | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $zip) { Write-Error "latest.zip not produced"; exit 1 }
          "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmoteMirror
          path: ${{ steps.pack.outputs.path }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.path }}
          generate_release_notes: true
